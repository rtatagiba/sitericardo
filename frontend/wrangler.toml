# Config lida tanto pelo build de produção do Cloudflare Pages quanto por
# `wrangler pages dev` local. Campos como account_id e remote (usados só pra
# apontar `wrangler pages dev` pra recursos remotos durante teste local) NÃO
# são aceitos aqui pelo validador de config do Pages — ficam só no comando
# local, veja CLAUDE.md. O binding MYBROWSER e o KV AX_TOOL_KV de produção
# precisam ser adicionados manualmente no dashboard: Pages project →
# Settings → Functions → Bindings.
name = "sitericardo-frontend"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-06"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "MYBROWSER"

[[kv_namespaces]]
binding = "AX_TOOL_KV"
id = "8fe76921e8e74281956febf322f0f42b"
