# Config lida tanto pelo build de produção do Cloudflare Pages quanto por
# `wrangler pages dev` local. Os bindings MYBROWSER (Browser Rendering) e
# AX_TOOL_KV (KV) NÃO são declarados aqui de propósito: o build de produção
# do Pages resolve o id de kv_namespaces contra a conta que hospeda o
# projeto, e essa conta é diferente da usada pra testar localmente — um id
# fixo aqui quebra o deploy ("KV namespace 'xxx' not found"). Os bindings de
# produção são configurados manualmente no dashboard do projeto Pages:
# Settings → Functions → Bindings (mesmo lugar onde já existe o SITE_KV).
# Pra testar local com bindings remotos reais, veja a seção abaixo.
name = "sitericardo-frontend"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-06"
compatibility_flags = ["nodejs_compat"]
